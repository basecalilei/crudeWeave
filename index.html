<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>crudeWeave</title>
    <!-- Linked here, not imported from main.ts, so the first paint is already
         styled (the loading box) instead of raw HTML while the scripts load. -->
    <script type="module" crossorigin src="./assets/index-BZxinNOb.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-DyQ9uXmn.css">
  </head>
  <!-- body.booting while the scripts load (the box spins small), then body.ready;
       body.empty until the first image is woven, then body.loaded (src/ui/intro.ts). -->
  <body class="empty booting">
    <header id="topbar">
      <img class="brand" src="./logoWeb.png" alt="Crudebox" />
      <!-- logoWeb.png is generated from assets/logo.png by scripts/makeWebLogo.py -->

      <!-- .tools fades in once an image is loaded. -->
      <div class="tools">
        <button id="btnOpen" title="Open an image (or drop one on the view)">Open image</button>
        <nav id="viewButtons" aria-label="View mode"></nav>
        <span class="spacer"></span>
        <button id="btnFit" title="Fit the whole blanket (F)">Fit</button>
        <button id="btn100" title="Zoom to 100% (0)">100%</button>
        <div class="menu">
          <button id="btnExport">Export ▾</button>
          <div id="exportMenu" hidden>
            <button data-export="img1" title="The whole image, same size as the original">Image, original size</button>
            <button data-export="img2" title="Twice the original size: thread detail starts to show">Image, 2× size</button>
            <button data-export="img4" title="Four times the original size: full thread detail">Image, 4× size</button>
            <button data-export="png1" title="Exactly what's on screen now, including the empty space around the image">Screen view as PNG</button>
            <button data-export="design">Design map PNG + legend</button>
            <button data-export="settings">Settings JSON</button>
          </div>
        </div>
        <button id="btnPanel" class="icon" title="Settings" aria-label="Settings" aria-expanded="false" aria-controls="side">
          <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true">
            <path d="M3 5h8M15 5h2M3 10h2M9 10h8M3 15h10" stroke="currentColor" stroke-width="1.4" stroke-linecap="square" fill="none" />
            <rect x="11" y="3" width="4" height="4" fill="none" stroke="currentColor" stroke-width="1.4" />
            <rect x="5" y="8" width="4" height="4" fill="none" stroke="currentColor" stroke-width="1.4" />
            <rect x="13" y="13" width="4" height="4" fill="none" stroke="currentColor" stroke-width="1.4" />
          </svg>
        </button>
      </div>
    </header>
    <main>
      <div id="viewport">
        <canvas id="view"></canvas>
        <div id="dropHint"><span>Drop to open</span></div>
        <div id="status"></div>
        <div id="readout"></div>
        <!-- Empty state: the Crudebox box. Covers the viewport until the first image is woven. -->
        <div id="intro">
          <div class="introBox"><img alt="" /></div>
          <p class="introText">Place an image in the box</p>
        </div>
      </div>
      <!-- Floating settings panel, opened by #btnPanel (class "open"). -->
      <aside id="side">
        <div id="pane"></div>
        <section id="structures"></section>
      </aside>
    </main>
    <input type="file" id="fileInput" accept="image/*" hidden />
    <input type="file" id="presetInput" accept=".json,application/json" hidden />
  </body>
</html>
